<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>chrome-bookmarks-mcp bridge</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #16181d;
        --muted: #5c6370;
        --border: #d8dbe2;
        --field: #f6f7f9;
        --ok: #1a7f47;
        --bad: #b4232c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181d;
          --fg: #e8eaee;
          --muted: #9aa2b1;
          --border: #2e323b;
          --field: #1e2127;
          --ok: #4ec98a;
          --bad: #ef7a80;
        }
      }
      body {
        margin: 0;
        padding: 32px;
        max-width: 560px;
        font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p.sub { color: var(--muted); margin: 0 0 24px; }
      label { display: block; font-weight: 600; margin: 18px 0 6px; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 9px 11px;
        font: inherit;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--fg);
        background: var(--field);
        border: 1px solid var(--border);
        border-radius: 7px;
      }
      button {
        margin-top: 20px;
        padding: 9px 18px;
        font: inherit;
        font-weight: 600;
        color: var(--bg);
        background: var(--fg);
        border: 0;
        border-radius: 7px;
        cursor: pointer;
      }
      .status {
        margin-top: 24px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--field);
      }
      .dot { font-weight: 700; }
      .dot.ok { color: var(--ok); }
      .dot.bad { color: var(--bad); }
      .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
      .row { display: flex; gap: 8px; align-items: stretch; }
      .row input { flex: 1; }
      button.secondary {
        margin-top: 0;
        padding: 0 14px;
        color: var(--fg);
        background: var(--field);
        border: 1px solid var(--border);
      }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>chrome-bookmarks-mcp bridge</h1>
    <p class="sub">Connects this browser to the local MCP server so Claude can reorganize your bookmarks.</p>

    <label for="token">Pairing token</label>
    <div class="row">
      <input id="token" type="text" spellcheck="false" placeholder="32 hex characters" />
      <button id="paste" type="button" class="secondary">Paste</button>
    </div>
    <p class="hint">
      The server prints this on startup. It also lives at
      <code>~/.chrome-bookmarks-mcp/token</code> (or <code>$CHROME_BOOKMARKS_MCP_HOME/token</code>).
    </p>

    <label for="port">Port</label>
    <input id="port" type="number" placeholder="45732" />

    <button id="save">Save and reconnect</button>

    <div class="status">
      <span id="dot" class="dot bad">offline</span>
      <div id="detail" class="hint">Loading status.</div>
    </div>

    <script src="options.js" type="module"></script>
  </body>
</html>
